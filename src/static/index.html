<!--
  Talos dashboard: page layout for the Pi's 1280x800 touchscreen.
  Header (clock, Google Home restart), three panels (Channel 01, Light,
  Pi Health) and the nav bar. Values start as placeholders; app.js fills
  them in from the server, and style.css handles the look.
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>// TALOS</h1>
        <p>v0.0.47</p>
      </div>
      <div class="header-right">
        <button id="restart-home" type="button">↻ GOOGLE HOME</button>
        <time id="clock">--:--</time>
      </div>
    </header>

    <main>
      <section class="panel purple-panel" id="channel-panel">
        <h2>01 / CHANNEL 01</h2>
        <div class="indicators">
          <div class="indicator" id="indicator1" data-state="unknown">
            <div class="square"></div>
            <span class="indicator-label">NO LINK</span>
            <span class="indicator-detail"></span>
          </div>
          <div class="indicator" id="indicator2" data-state="unknown">
            <div class="square"></div>
            <span class="indicator-label">NO LINK</span>
            <span class="indicator-detail"></span>
          </div>
        </div>
      </section>

      <section class="panel" id="light-panel">
        <h2>02 / LIGHT</h2>
        <div class="indicators">
          <div class="indicator" id="lux" data-state="unknown">
            <div class="square"></div>
            <span class="indicator-label">NO LINK</span>
            <span class="indicator-detail"></span>
          </div>
          <div class="indicator" id="daylight" data-state="unknown">
            <div class="square"></div>
            <span class="indicator-label">—</span>
            <span class="indicator-detail"></span>
          </div>
        </div>
      </section>

      <section class="panel" id="health-panel">
        <h2>03 / PI HEALTH</h2>
        <div class="health-row">
          <div class="big-stats">
            <div>
              <span class="label">CPU TEMP</span>
              <strong id="cpu-temp" class="blue">—</strong>
            </div>
            <div>
              <span class="label">CPU USAGE</span>
              <strong id="cpu-usage" class="purple">—</strong>
            </div>
            <div>
              <span class="label">RAM</span>
              <strong id="ram-percent" class="blue">—</strong>
            </div>
            <div>
              <span class="label">DISK</span>
              <strong id="disk-percent" class="purple">—</strong>
            </div>
          </div>
          <dl class="small-stats">
            <dt>RAM</dt><dd id="ram">—</dd>
            <dt>DISK</dt><dd id="disk">—</dd>
            <dt>UP</dt><dd id="uptime">—</dd>
          </dl>
        </div>
      </section>
    </main>

    <nav aria-label="Pages">
      <button type="button" data-page="overview" aria-current="page"><small>01</small>OVERVIEW</button>
      <button type="button" data-page="google-home"><small>02</small>GOOGLE HOME</button>
    </nav>

    <script src="app.js"></script>
  </body>
</html>
